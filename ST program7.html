<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicate Dropdown for Selenium</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin-top:80px;
            text-align:center;
            background:#f5f5f5;
        }

        select{
            width:250px;
            height:220px;
            font-size:18px;
        }

        h2{
            color:#333;
        }
    </style>
</head>

<body>

<h2>Country List (Contains Duplicate Options)</h2>

<select id="country" multiple size="10">
    <option>India</option>
    <option>USA</option>
    <option>India</option>
    <option>Australia</option>
    <option>Canada</option>
    <option>USA</option>
    <option>Germany</option>
    <option>Japan</option>
    <option>Canada</option>
    <option>India</option>
</select>

</body>
</html>
